name: Unverified contact numbers

# Every number published on this site must have a recorded source. A number with
# no source does not fail the build — an emergency site must stay updatable even
# when a check is pending, and nobody may be in post to clear it.
#
# So instead it nags. This runs monthly and opens an issue naming every number
# still waiting on a human, the same way token-expiry.yml handles the deploy
# token. A warning printed during a build is a warning nobody reads.

on:
  schedule:
    - cron: '0 9 1 * *'   # 09:00 on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write   # the heartbeat commit at the end of this job
  issues: write

jobs:
  check:
    name: List numbers still waiting on a human
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Collect unverified numbers
        id: check
        run: |
          # Deliberately not `set -e`. check-contacts.mjs exits 1 when a
          # published number has no provenance record at all, or when a WhatsApp
          # link disagrees with the number beside it. Under `set -e` that killed
          # this step, left `count` unset, made the `if:` guard below false and
          # raised no issue — so the one state that most needs reporting was the
          # one state that reported nothing.
          set -uo pipefail
          if node check-contacts.mjs --json > unverified.json 2> check-stderr.txt; then
            count=$(node -e "console.log(require('./unverified.json').unverified.length)")
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "Unverified numbers: $count"
            cat unverified.json
          else
            count=0
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::check-contacts.mjs failed. The site has a number with no record, or a WhatsApp link that does not match."
            cat check-stderr.txt
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Raise an issue if any number is unverified, or the check itself failed
        if: steps.check.outputs.count != '0' || steps.check.outputs.failed == 'true'
        uses: actions/github-script@v9
        env:
          CHECK_FAILED: ${{ steps.check.outputs.failed }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Contact numbers still waiting to be verified';

            // The check exited non-zero: something is wrong now, not pending.
            if (process.env.CHECK_FAILED === 'true') {
              const detail = fs.existsSync('check-stderr.txt')
                ? fs.readFileSync('check-stderr.txt', 'utf8').slice(0, 4000)
                : '(no output captured)';
              const body = [
                '**`check-contacts.mjs` failed.** This is not a pending verification — it means a',
                'number is published with no provenance record at all, or a WhatsApp link no longer',
                'matches the number printed beside it. Both fail the build, so the site cannot',
                'currently be updated until it is fixed.',
                '', '```', detail, '```', '',
                'Run `npm run check` locally to reproduce.',
              ].join('\n');
              const { data: open } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: 'unverified-numbers',
              });
              if (open.length) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: open[0].number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: 'check-contacts.mjs is failing', body, labels: ['unverified-numbers'],
                });
              }
              return;
            }

            const data = JSON.parse(fs.readFileSync('unverified.json', 'utf8'));

            const lines = [
              `**${data.unverified.length} of the ${data.published} phone numbers on this site have no confirmed source.**`,
              '',
              'They are live. Each one needs a human to ring it or to find it published by the',
              'organisation itself. **Do not replace one with a plausible alternative** — swapping',
              'an unverified number for another unverified number is not a fix.',
              '',
            ];

            for (const u of data.unverified) {
              lines.push(`### ${u.number} — ${u.service}`);
              lines.push('');
              lines.push(u.reason);
              lines.push('');
              lines.push(`Raised: ${u.raised || 'unknown'}`);
              lines.push(`Appears in: ${u.files.map((f) => `\`${f}\``).join(', ')}`);
              lines.push('');
            }

            lines.push('---');
            lines.push('');
            lines.push('When one is confirmed, record the date and the source against it — in');
            lines.push('`src/_data/contacts.json` if it is in the register, or in `PAGE_LOCAL` in');
            lines.push('`check-contacts.mjs` if it lives in page content. It then drops off this list.');
            lines.push('');
            lines.push('If a number cannot be confirmed at all, it should come off the site rather');
            lines.push('than stay published on the strength of nobody having questioned it.');

            const body = lines.join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'unverified-numbers',
            });

            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['unverified-numbers'],
              });
            }


      # ---------------------------------------------------------------------
      # Keeps every scheduled check in this repository alive.
      #
      # GitHub disables scheduled workflows after 60 days without repository
      # activity, and only a commit resets that timer — not an issue, not a
      # workflow run. So both monitors here would switch themselves off in
      # precisely the unattended scenario they were written for.
      #
      # This commits to a dedicated `keepalive` branch, NOT to main:
      #
      #   1. The main ruleset requires a pull request, so a direct push is
      #      rejected. The usual fix is to add the GitHub Actions app as a
      #      bypass actor, but this repository belongs to a user account rather
      #      than an organisation and GitHub refuses it — "Actor GitHub Actions
      #      integration must be part of the ruleset source or owner
      #      organization". Tried on 15 Sept 2026.
      #   2. Not weakening main's protection to solve a housekeeping problem is
      #      the better trade anyway.
      #
      # Honest caveat: GitHub documents this as "repository activity" and a push
      # to any branch should qualify, but their wording is not explicit about
      # non-default branches. If the monitors are ever found disabled despite
      # this, the fallback is a calendar reminder to push anything. GitHub does
      # email the repository owner before disabling them.
      #
      # Only on the schedule. A manual run must not commit.
      # ---------------------------------------------------------------------
      - name: Heartbeat, so the scheduled checks do not switch themselves off
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin keepalive >/dev/null 2>&1; then
            git fetch --depth=1 origin keepalive
            git checkout -q -B keepalive FETCH_HEAD
          else
            git checkout -q --orphan keepalive
            git rm -rq --cached . || true
            rm -f last-scheduled-check
          fi
          date -u +'%Y-%m-%d %H:%M UTC' > last-scheduled-check
          git add -f last-scheduled-check
          git commit -q -m "Heartbeat $(date -u +'%Y-%m-%d')" || exit 0
          git push -q origin keepalive
