name: Build and deploy

# Do NOT add pull_request_target, and do not add a fork-PR deploy — on a public
# repo those are the two patterns that leak secrets. Decap's CMS branches are
# in-repo, so an ordinary pull_request run gets the secrets it needs safely.
#
# Every successful production deploy costs Netlify credits (15 each as of Sept
# 2026; previews and failed deploys are free, bandwidth is 20 per GB). So a
# change that cannot alter the built site does not deploy at all. The list
# below is only files Eleventy never reads: if a path here ever feeds the
# build, a change to it would silently not reach the site. A pull request that
# mixes one of these with anything else deploys as normal. The job is not a
# required status check, so a skipped run blocks no merge.
on:
  push:
    branches: [main]          # production deploy after a pull request is merged
    paths-ignore:
      - 'CLAUDE.md'
      - 'README.md'
      - '.github/workflows/token-expiry.yml'
      - '.github/workflows/unverified-numbers.yml'
  pull_request:
    branches: [main]          # preview deploy for each CMS branch
    paths-ignore:
      - 'CLAUDE.md'
      - 'README.md'
      - '.github/workflows/token-expiry.yml'
      - '.github/workflows/unverified-numbers.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Host-neutral on purpose. This name is the status-check context that the
    # main ruleset requires before a merge, so renaming it makes every open pull
    # request unmergeable until the ruleset is updated to match. Leave it alone
    # when the host changes.
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      issues: write        # only to raise the alarm below on a failed publish
      statuses: write      # needed to post the preview URL back for the CMS
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards against a contact number being changed in the CMS while stale
      # copies remain in page content. A wrong phone number is the worst defect
      # this site can ship, so it fails the run before anything deploys.
      - name: Check emergency contact numbers
        run: npm run check

      # cms-auth/test.mjs covers which origin the OAuth proxy hands the GitHub
      # token to. That got the wrong answer once and the symptom was a sign-in
      # that hangs with no error, so it is cheap to keep it honest here.
      - name: Check the CMS auth proxy
        run: npm run test:auth

      # npm run build runs the contact check first, so this covers it too. The
      # explicit step above stays: it names the failure when it is the cause.
      - name: Build
        run: npm run build

      # --prod only on a merge to main. A pull request gets a draft deploy, which
      # is what the CMS shows an editor as "View Preview" before they publish.
      #
      # The CLI version is pinned. An unpinned `npx netlify-cli` would silently
      # take whatever was published that morning, on the one workflow that puts
      # content in front of the public.
      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_PREPARE_GIBRALTAR }}
          # Not a secret — a project identifier that appears in URLs and in the
          # Netlify dashboard. Kept here rather than in secrets so there is one
          # fewer thing to lose, and so a reader can see which site this deploys
          # to without dashboard access.
          NETLIFY_SITE_ID: 8dfda9be-7094-44cf-99f1-3b9e221c0986
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            prod=""
          else
            prod="--prod"
          fi
          npx --yes netlify-cli@27 deploy \
            --dir=_site \
            $prod \
            --json \
            --message "${{ github.event.pull_request.head.sha || github.sha }} — ${{ github.head_ref || github.ref_name }}" \
            > deploy.json
          # deploy_url is the immutable per-deploy address, which is the right
          # thing to show a reviewer: it keeps pointing at what they approved
          # even after someone else deploys.
          url=$(node -e "const d=require('./deploy.json'); console.log(d.deploy_url || d.url || '')")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # ----------------------------------------------------------------------
      # TEMPORARY — remove once prepare.gov.gi is live and pages.dev redirects.
      #
      # prepare-gibraltar.pages.dev is still the address people have been given,
      # so it must keep receiving content until the new domain replaces it. If
      # this step goes before the DNS moves, an editor publishes a change, the
      # CMS reports success, and the address the public actually holds silently
      # stays on the old content.
      #
      # Production only. Previews go to Netlify, which is where reviewing should
      # happen from now on.
      # ----------------------------------------------------------------------
      - name: Also deploy to Cloudflare Pages, until the domain moves
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=prepare-gibraltar
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=true

      # ----------------------------------------------------------------------
      # A failed production deploy is the one failure an editor cannot see.
      #
      # Publishing is deliberately instant: this is an emergency site, and being
      # told "the road is closed, change the text" has to be actionable now, not
      # after a review gate. The cost of that choice is that a publish which
      # breaks the build merges cleanly, the CMS reports success, and the site
      # quietly stays on the previous version.
      #
      # So the failure is made loud instead of being prevented. The site itself
      # is never damaged — the build fails before anything is uploaded, and the
      # last good version keeps serving.
      # ----------------------------------------------------------------------
      - name: Raise the alarm if a published change failed to deploy
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '**A change was published but did not reach the site.**',
              '',
              `Commit: ${context.sha}`,
              `Failed run: ${run}`,
              '',
              'The live site is **not** broken — it is still serving the previous version, because',
              'the build failed before anything was uploaded. What is missing is the change somebody',
              'just published, and the CMS will have told them it worked.',
              '',
              '### Most likely cause',
              '',
              'A contact number was edited and now has no recorded source, or a WhatsApp link no',
              'longer matches the number printed beside it. Both deliberately fail the build. Run',
              '`npm run check` locally, or open the failed run above — it names every file.',
              '',
              '### What to do',
              '',
              '1. Tell whoever published that their change is not live yet.',
              '2. Fix the cause and push. The next successful deploy carries their change with it.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'failed-deploy',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'A published change did not reach the site',
                body, labels: ['failed-deploy'],
              });
            }

      # Decap looks for a commit status whose context contains "deploy" to show a
      # "View Preview" link on the editorial workflow card. Netlify's own GitHub
      # integration is not in use here — we deploy from this workflow — so this
      # status is the only thing that puts that link in front of an editor.
      - name: Publish preview link for the CMS
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            if (!process.env.PREVIEW_URL) {
              core.warning('No preview URL returned by the deploy; skipping status.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'deploy/preview',
              target_url: process.env.PREVIEW_URL,
              description: 'Preview deployment ready',
            });
