backend:
  name: github
  repo: hmgog-comms/prepare-gibraltar
  # Required. Decap defaults to "master" and would fail to read anything.
  branch: main
  # Origin only — no path, no trailing slash. Decap refuses the OAuth reply
  # unless the message origin matches this exactly, and a path here produces a
  # login that hangs silently.
  base_url: https://prepare-gibraltar-cms-auth.pressoffice.workers.dev
  auth_endpoint: auth
  # One commit per published change, rather than one per save.
  squash_merges: true
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" ({{author-login}})'
    update: 'Update {{collection}} "{{slug}}" ({{author-login}})'
    delete: 'Delete {{collection}} "{{slug}}" ({{author-login}})'
    uploadMedia: 'Upload "{{path}}" ({{author-login}})'
    deleteMedia: 'Delete "{{path}}" ({{author-login}})'

# Saves open a pull request instead of committing to main.
publish_mode: editorial_workflow

site_url: https://prepare-gibraltar.pages.dev

# Inert in production — Decap only acts on this when served from localhost.
# For local CMS work run `npx decap-server` alongside `npm start`.
local_backend: true

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "hazards"
    label: "Hazards"
    folder: "src/hazards"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/hazard.njk"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Summary", name: "summary", widget: "string"}
      - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false}
      - {label: "Thumbnail Position", name: "thumbnail_position", widget: "string", required: false, hint: "Optional CSS position for the thumbnail crop, e.g. 'center 30%'"}
      - {label: "Who is Most at Risk", name: "at_risk", widget: "text"}
      - {label: "Before", name: "before", widget: "markdown"}
      - {label: "During", name: "during", widget: "markdown"}
      - {label: "After", name: "after", widget: "markdown"}
      - {label: "Further Information and Resources", name: "resources", widget: "markdown", required: false, hint: "Optional list of external links, one per line, e.g. - [Airquality.gi](https://www.gibraltarairquality.gi/)"}
      - {label: "Local Contacts", name: "local_contacts", widget: "markdown", required: false}
      - {label: "Tags", name: "tags", widget: "hidden", default: "hazards"}

  # The site's register of contact numbers. This is the single source: the
  # emergency contacts page and the homepage teaser both render from it, and the
  # tel: link is generated from the number, so a link can never disagree with the
  # number printed beside it. check-contacts.mjs reads the same file before every
  # build and fails it if a number here has a stale copy anywhere in the content.
  - name: "emergency-contacts"
    label: "Emergency Contacts"
    files:
      - label: "Contact numbers"
        name: "emergency-contacts"
        file: "src/_data/contacts.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Groups"
            name: "groups"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - {label: "Table heading", name: "caption", widget: "string"}
              - label: "Contacts"
                name: "rows"
                widget: "list"
                summary: "{{fields.service}} — {{fields.number}}"
                fields:
                  - {label: "Service", name: "service", widget: "string"}
                  # Digits and spaces only. The tel: link is built from this by
                  # stripping the spaces, so brackets or hyphens would produce a
                  # link that does not dial. Rejected here rather than discovered
                  # by someone trying to call it.
                  - {label: "Number", name: "number", widget: "string", required: false,
                     pattern: ['^\+?[0-9 ]+$', "Digits and spaces only — no brackets or hyphens"],
                     hint: "Leave empty for a contact that is not a phone number, and use Detail instead."}
                  # Derived into a wa.me link, the same way Number is derived into
                  # a tel: link. Do not hand-write the link in "Extra contact
                  # lines" — that is how the number came to be written twice.
                  - {label: "WhatsApp number", name: "whatsapp", widget: "string", required: false,
                     pattern: ['^[0-9 ]+$', "Digits and spaces only, without the +350"],
                     hint: "Gibraltar number without the +350, e.g. 56003195."}
                  - {label: "Detail", name: "detail", widget: "string", required: false,
                     hint: "Used instead of a number — for example a radio frequency."}
                  - {label: "Extra contact lines", name: "extra", widget: "list", required: false,
                     hint: "Additional ways to make contact, each shown on its own line under the number."}
                  - {label: "When to use", name: "when", widget: "string"}
                  # Provenance. Optional, but a number with no source is reported
                  # as unverified by check-contacts.mjs on every build and in a
                  # monthly issue — because a number that was wrong from the first
                  # keystroke matches itself perfectly and no consistency check can
                  # catch it. If you are not sure, say so and ask rather than guess.
                  - {label: "Date checked", name: "verified", widget: "datetime", required: false,
                     format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false,
                     hint: "The day you last confirmed this number against a published source."}
                  - {label: "Where you checked it", name: "source", widget: "string", required: false,
                     hint: "Name the source, e.g. \"police.gi/contact\" or \"rang the switchboard\". Leave blank if you could not confirm it — it will be flagged rather than silently trusted."}
                  - {label: "Show on the homepage", name: "homepage", widget: "boolean", required: false, default: false}
                  - {label: "Highlight (999 only)", name: "emphasis", widget: "boolean", required: false, default: false}

  - name: "site"
    label: "Site details"
    files:
      - label: "Site details"
        name: "site"
        file: "src/_data/site.json"
        extension: "json"
        format: "json"
        fields:
          - {label: "Site name", name: "name", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Footer text", name: "footerText", widget: "string"}
          - {label: "Base URL", name: "baseURL", widget: "hidden"}
          - {label: "Analytics ID", name: "analyticsID", widget: "hidden"}

  - name: "pages"
    label: "Pages"
    files:
      # Field order is also the key order Decap writes back, so it matches the
      # order of keys in homepage.json. The WhatsApp icon, the section wrappers
      # and the contacts table markup stay in src/index.njk — this is the words.
      - label: "Homepage"
        name: "homepage"
        file: "src/_data/homepage.json"
        extension: "json"
        format: "json"
        fields:
          - {label: "Hero headline", name: "heroHeadline", widget: "string"}
          - {label: "Hero subheadline", name: "heroSubheadline", widget: "string"}
          - {label: "Hero text", name: "heroBody", widget: "text"}
          - label: "Hero buttons"
            name: "heroActions"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - {label: "Button text", name: "label", widget: "string"}
              - {label: "Link", name: "url", widget: "string"}
              - {label: "Style", name: "style", widget: "select", options: ["btn--white", "btn--outline", "btn--primary"]}
          - {label: "Emergency notice", name: "disclaimerLead", widget: "text",
             hint: "Text between ** becomes bold."}
          - {label: "Text above the WhatsApp links", name: "disclaimerChannelsIntro", widget: "text"}
          - label: "WhatsApp channels"
            name: "whatsappChannels"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Channel name", name: "name", widget: "string"}
              - {label: "Link", name: "url", widget: "string"}
          - {label: "Cards heading", name: "pillarsHeading", widget: "string"}
          - label: "Cards"
            name: "pillars"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Link text", name: "linkLabel", widget: "string"}
              - {label: "Link", name: "url", widget: "string"}
              - {label: "Background image", name: "image", widget: "image",
                 hint: "Add images from inside this entry, never from the Media Library button in the top bar — that one commits straight to main and is rejected."}
              - {label: "Accessibility id", name: "id", widget: "string",
                 hint: "Links the card's heading to its container for screen readers. Must be unique on the page and contain no spaces."}
          - {label: "Steps heading", name: "stepsHeading", widget: "string"}
          - {label: "Steps introduction", name: "stepsIntro", widget: "text"}
          - label: "Steps"
            name: "steps"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Show the WhatsApp channels under this step", name: "showChannels", widget: "boolean", required: false, default: false}
          - {label: "Steps button text", name: "stepsButtonLabel", widget: "string"}
          - {label: "Steps button link", name: "stepsButtonUrl", widget: "string"}
          - {label: "Contacts heading", name: "contactsHeading", widget: "string"}
          - {label: "Contacts introduction", name: "contactsIntro", widget: "text"}
          - {label: "Emergency block label", name: "emergencyBlockLabel", widget: "string"}
          - {label: "Emergency block number", name: "emergencyBlockNumber", widget: "string"}
          - {label: "Emergency block subtitle", name: "emergencyBlockSub", widget: "string"}
          - {label: "Contacts link text", name: "contactsLinkLabel", widget: "string"}
          - {label: "Contacts link", name: "contactsLinkUrl", widget: "string"}
        # The three contact rows below the 999 block come from the Emergency
        # Contacts collection, not from here — same list as the contacts page.

      # Prose pages built from a list of sections. The markup lives in
      # src/_includes/layouts/sections.njk; only the words are edited here.
      # Markdown fields are forced to modes: ["raw"] — the rich-text editor
      # round-trips through remark, which strips the target/rel attributes and
      # the visually-hidden spans that the external links depend on.
      - label: "Get Prepared"
        name: "get-prepared"
        file: "src/get-prepared/index.md"
        format: "yaml-frontmatter"
        fields:
          # Field order here is also the key order Decap writes back — it sorts
          # frontmatter by it on save. Keep it matching the order in the .md file
          # or the first save reorders the whole file for no reason.
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/sections.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description (for search engines)", name: "description", widget: "text"}
          - {label: "Numbered headings", name: "numbered", widget: "hidden", default: true}
          - {label: "Show contents list", name: "contentsNav", widget: "hidden", default: true}
          - {label: "Introduction", name: "intro", widget: "text"}
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - label: "Anchor"
                name: "id"
                widget: "string"
                pattern: ['^[a-z0-9-]+$', "Lower-case letters, numbers and hyphens only"]
                hint: "Used by links that point at this section, including the redirect from the old Alerts page. Changing it breaks those links — leave it alone unless you know what links here."
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Content", name: "body", widget: "markdown", modes: ["raw"]}

      - label: "Emergency Contacts page (text around the tables)"
        name: "emergency-contacts-page"
        file: "src/emergency-contacts/index.md"
        format: "yaml-frontmatter"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/contacts.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description (for search engines)", name: "description", widget: "text"}
          - {label: "Introduction", name: "intro", widget: "text"}
          - label: "Emergency box"
            name: "alertTop"
            widget: "object"
            fields:
              - {label: "Style", name: "variant", widget: "select", options: ["info", "warning", "danger"]}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "body", widget: "markdown", modes: ["raw"]}
          - label: "Table column headings"
            name: "columns"
            widget: "object"
            fields:
              - {label: "First column", name: "service", widget: "string"}
              - {label: "Second column", name: "contact", widget: "string"}
              - {label: "Third column", name: "when", widget: "string"}
          - label: "Closing box"
            name: "alert"
            widget: "object"
            fields:
              - {label: "Style", name: "variant", widget: "select", options: ["info", "warning", "danger"]}
              - {label: "Spacing", name: "style", widget: "hidden"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "body", widget: "markdown", modes: ["raw"]}
        # The contact rows themselves are edited under "Emergency Contacts",
        # because the homepage teaser reads the same list.

      - label: "Downloads"
        name: "downloads"
        file: "src/downloads/index.md"
        format: "yaml-frontmatter"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/downloads.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description (for search engines)", name: "description", widget: "text"}
          - {label: "Introduction", name: "intro", widget: "text"}
          - label: "Notice box"
            name: "alertTop"
            widget: "object"
            fields:
              - {label: "Style", name: "variant", widget: "select", options: ["info", "warning", "danger"]}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "body", widget: "markdown", modes: ["raw"]}
          - label: "Documents"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Name", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              # A path, not an upload. Each PDF is generated from the .html web
              # version beside it by generate-pdfs.mjs; uploading a replacement
              # here would put the two out of step. Adding a genuinely new
              # document is a developer task — ask for the file to be created,
              # then add the row.
              #
              # The PDFs are tagged for screen readers: they are printed from the
              # HTML with headless Chrome, so headings, lists and tables carry
              # across as structure (checked 16 Sept 2026).
              - {label: "File path", name: "file", widget: "string",
                 pattern: ['^/assets/downloads/[A-Za-z0-9._-]+$', "Must be a path like /assets/downloads/name.pdf"],
                 hint: "Path to an existing file in src/assets/downloads/, e.g. /assets/downloads/grab-bag-checklist.pdf"}
              - {label: "Link text", name: "label", widget: "string", default: "Download PDF"}

      - label: "Hazards page (intro and warning only)"
        name: "hazards-index"
        file: "src/hazards/index.md"
        format: "yaml-frontmatter"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/hazards-index.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description (for search engines)", name: "description", widget: "text"}
          - {label: "Introduction", name: "intro", widget: "text"}
          - label: "Warning box"
            name: "alertTop"
            widget: "object"
            fields:
              - {label: "Style", name: "variant", widget: "select", options: ["info", "warning", "danger"]}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "body", widget: "markdown", modes: ["raw"]}
        # The 18 hazard cards below the warning are built from the hazard pages
        # themselves and are not editable here — change a card by editing that
        # hazard, so its name and summary have one home.

      - label: "Page not found (404)"
        name: "404"
        file: "src/404.md"
        format: "yaml-frontmatter"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/sections.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description (for search engines)", name: "description", widget: "text"}
          - {label: "Permalink", name: "permalink", widget: "hidden", default: "404.html"}
          - {label: "Introduction", name: "intro", widget: "text"}
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Content", name: "body", widget: "markdown", modes: ["raw"]}
          - label: "Emergency box"
            name: "alert"
            widget: "object"
            fields:
              - {label: "Style", name: "variant", widget: "select", options: ["info", "warning", "danger"]}
              - {label: "Text", name: "body", widget: "markdown", modes: ["raw"]}

      - label: "Persons with Disabilities"
        name: "persons-with-disabilities"
        file: "src/persons-with-disabilities/index.md"
        format: "yaml-frontmatter"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/sections.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description (for search engines)", name: "description", widget: "text"}
          - {label: "Introduction", name: "intro", widget: "text"}
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Content", name: "body", widget: "markdown", modes: ["raw"]}

  - name: "policies"
    label: "Policy Pages"
    files:
      - label: "Privacy Notice"
        name: "privacy-notice"
        file: "src/privacy-notice/index.md"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/page.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description (for search engines)", name: "description", widget: "text"}
          - {label: "Page content", name: "body", widget: "markdown"}
      - label: "Cookie Policy"
        name: "cookie-policy"
        file: "src/cookie-policy/index.md"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/page.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description (for search engines)", name: "description", widget: "text"}
          - {label: "Page content", name: "body", widget: "markdown"}
      - label: "Accessibility Statement"
        name: "accessibility-statement"
        file: "src/accessibility-statement/index.md"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/page.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description (for search engines)", name: "description", widget: "text"}
          - {label: "Page content", name: "body", widget: "markdown"}
